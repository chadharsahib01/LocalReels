<!doctype html>
<html lang="ur" data-accent="teal" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080B12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>LocalReels</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      :root {
        --c-bg: #080b12;
        --c-ink: #04060b;
        --c-surface: #101624;
        --c-surface-2: #182031;
        --c-line: #243049;
        --c-line-2: #3a4a6b;
        --c-text: #f4f7fc;
        --c-dim: #a3aec4;
        --c-faint: #7c88a1;
        --c-a1: #2ce5c8;
        --c-a2: #4d9fff;
        --c-a3: #ff3d7f;
        --c-ok: #7ee56a;
        --c-warn: #ffb020;
        --c-danger: #ff6b6b;
        --c-violet: #a78bfa;
        --grad: linear-gradient(
          135deg,
          var(--c-a1),
          var(--c-a2) 52%,
          var(--c-a3)
        );
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 24px;
        --sp-6: 32px;
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-xl: 22px;
        --r-full: 999px;
        --fs-xs: 11px;
        --fs-sm: 12.5px;
        --fs-md: 14px;
        --fs-lg: 17px;
        --fs-xl: 22px;
        --tap: 44px;
        --top: 60px;
        --nav: 0px;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
        --font-display:
          "Sora", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        --font-body:
          "Inter", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        --dur: 220ms;
        --ease: cubic-bezier(0.32, 0.72, 0.28, 1);
      }
      html[data-accent="magenta"] {
        --c-a1: #ff3d7f;
        --c-a2: #a78bfa;
        --c-a3: #2ce5c8;
      }
      html[data-accent="amber"] {
        --c-a1: #ffb020;
        --c-a2: #ff7a45;
        --c-a3: #4d9fff;
      }
      html[data-accent="lime"] {
        --c-a1: #a3e635;
        --c-a2: #2ce5c8;
        --c-a3: #ff3d7f;
      }
      html[data-theme="light"] {
        --c-bg: #f2f5fb;
        --c-ink: #e4e9f2;
        --c-surface: #fff;
        --c-surface-2: #edf1f8;
        --c-line: #d2dae8;
        --c-line-2: #afbcd2;
        --c-text: #0b1220;
        --c-dim: #4e5a73;
        --c-faint: #6b7789;
        --shadow: 0 18px 50px rgba(20, 30, 60, 0.14);
      }
      body[data-eff="mobile"] {
        --top: 54px;
        --nav: 60px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--c-bg);
        color: var(--c-text);
        font-family: var(--font-body);
        font-size: var(--fs-md);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      h1,
      h2,
      h3,
      .brand b,
      .stat-num {
        font-family: var(--font-display);
        letter-spacing: -0.01em;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--c-text);
        background: var(--c-surface-2);
        border: 1px solid var(--c-line);
        border-radius: var(--r-md);
        padding: var(--sp-3);
        font-size: var(--fs-md);
        outline: none;
        width: 100%;
        min-height: var(--tap);
      }
      textarea {
        resize: vertical;
        min-height: 88px;
        line-height: 1.5;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--c-a1);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-a1) 24%, transparent);
      }
      select {
        appearance: none;
        cursor: pointer;
        padding-right: 32px;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--c-dim) 50%),
          linear-gradient(135deg, var(--c-dim) 50%, transparent 50%);
        background-position:
          calc(100% - 17px) 50%,
          calc(100% - 12px) 50%;
        background-size: 5px 5px;
        background-repeat: no-repeat;
      }
      option {
        background: var(--c-surface);
      }
      :focus-visible {
        outline: 3px solid var(--c-a1);
        outline-offset: 2px;
        border-radius: var(--r-sm);
      }
      .skip {
        position: fixed;
        top: -60px;
        left: 12px;
        z-index: 600;
        background: var(--c-a1);
        color: #06121a;
        padding: 12px 18px;
        border-radius: var(--r-md);
        font-weight: 700;
        transition: top var(--dur);
      }
      .skip:focus {
        top: 12px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .hidden {
        display: none !important;
      }
      .sub {
        color: var(--c-dim);
        font-size: var(--fs-sm);
      }
      .note {
        font-size: var(--fs-xs);
        color: var(--c-faint);
        line-height: 1.6;
        margin-top: var(--sp-3);
      }
      .row {
        display: flex;
        gap: var(--sp-2);
        justify-content: center;
        flex-wrap: wrap;
      }
      .row.left {
        justify-content: flex-start;
      }
      .full {
        width: 100%;
        justify-content: center;
      }
      .mt {
        margin-top: var(--sp-4);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--c-line-2) transparent;
      }
      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--c-line-2);
        border-radius: var(--r-full);
        border: 2px solid var(--c-bg);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--c-a1);
      }
      .aurora {
        position: fixed;
        width: 58vmax;
        height: 58vmax;
        border-radius: 50%;
        filter: blur(95px);
        opacity: 0.1;
        pointer-events: none;
        z-index: 0;
      }
      .aurora.a {
        background: radial-gradient(circle, var(--c-a1), var(--c-a2));
        top: -26vmax;
        left: -16vmax;
      }
      .aurora.b {
        background: radial-gradient(circle, var(--c-a3), var(--c-violet));
        bottom: -28vmax;
        right: -18vmax;
      }
      .ic {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .ic.xs {
        width: 15px;
        height: 15px;
      }
      .ic.big {
        width: 46px;
        height: 46px;
        stroke-width: 1.5;
        color: var(--c-faint);
      }
      .ic.xl {
        width: 38px;
        height: 38px;
        color: var(--c-a1);
      }
      .ic.fill {
        fill: currentColor;
        stroke: none;
      }
      .spin {
        animation: sp 1.1s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--sp-2);
        background: var(--grad);
        color: #06121a;
        font-weight: 700;
        font-size: var(--fs-md);
        padding: var(--sp-3) var(--sp-4);
        border-radius: var(--r-md);
        min-height: var(--tap);
        transition:
          transform var(--dur),
          filter var(--dur);
        white-space: nowrap;
      }
      .btn:hover {
        filter: brightness(1.1);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn .ic {
        width: 18px;
        height: 18px;
      }
      .btn.ghost {
        background: var(--c-surface-2);
        color: var(--c-text);
        border: 1px solid var(--c-line);
      }
      .btn.ghost:hover {
        border-color: var(--c-a1);
        color: var(--c-a1);
      }
      .btn.danger {
        background: color-mix(in srgb, var(--c-danger) 16%, transparent);
        color: var(--c-danger);
        border: 1px solid color-mix(in srgb, var(--c-danger) 45%, transparent);
      }
      .btn.xs {
        padding: var(--sp-2) var(--sp-3);
        font-size: var(--fs-sm);
        min-height: 36px;
      }
      .btn.xs .ic {
        width: 15px;
        height: 15px;
      }
      .link {
        color: var(--c-a1);
        font-size: var(--fs-sm);
        font-weight: 600;
        text-decoration: underline;
        min-height: var(--tap);
        display: inline-flex;
        align-items: center;
      }
      .ib {
        width: var(--tap);
        height: var(--tap);
        border-radius: var(--r-full);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--c-dim);
        transition:
          background var(--dur),
          color var(--dur);
        flex: none;
      }
      .ib:hover {
        background: var(--c-surface-2);
        color: var(--c-text);
      }
      .ib.on {
        color: var(--c-a1);
        background: color-mix(in srgb, var(--c-a1) 16%, transparent);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--sp-1);
        background: color-mix(in srgb, var(--c-a1) 14%, transparent);
        color: var(--c-a1);
        border: 1px solid color-mix(in srgb, var(--c-a1) 32%, transparent);
        border-radius: var(--r-full);
        padding: 6px 12px;
        font-size: var(--fs-sm);
        font-weight: 600;
        min-height: 32px;
      }
      .chip.mini {
        padding: 3px 9px;
        font-size: var(--fs-xs);
        min-height: 24px;
      }
      .tag {
        background: color-mix(in srgb, var(--c-violet) 16%, transparent);
        color: var(--c-violet);
        border: 1px solid color-mix(in srgb, var(--c-violet) 34%, transparent);
        border-radius: var(--r-full);
        padding: 4px 10px;
        font-size: var(--fs-sm);
        min-height: 28px;
      }
      .tag.mini {
        padding: 2px 8px;
        font-size: var(--fs-xs);
        min-height: 22px;
      }
      .chips {
        display: flex;
        gap: var(--sp-2);
        flex-wrap: wrap;
        margin: var(--sp-3) 0;
      }
      .seg {
        display: flex;
        background: var(--c-surface-2);
        border: 1px solid var(--c-line);
        border-radius: var(--r-md);
        padding: 3px;
        gap: 2px;
      }
      .seg button {
        padding: var(--sp-2) var(--sp-3);
        border-radius: var(--r-sm);
        color: var(--c-dim);
        display: flex;
        min-height: 36px;
        align-items: center;
      }
      .seg button .ic {
        width: 17px;
        height: 17px;
      }
      .seg button.on {
        background: var(--grad);
        color: #06121a;
      }
      #top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 60;
        height: calc(var(--top) + var(--sat));
        padding: var(--sat) calc(var(--sp-2) + var(--sar)) 0
          calc(var(--sp-2) + var(--sal));
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        background: color-mix(in srgb, var(--c-bg) 88%, transparent);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--c-line);
        transition:
          transform var(--dur),
          opacity var(--dur);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        flex: none;
        min-height: var(--tap);
      }
      .brand i {
        width: 28px;
        height: 28px;
        border-radius: var(--r-sm);
        background: var(--grad);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brand i svg {
        width: 15px;
        height: 15px;
        fill: #06121a;
      }
      .brand b {
        font-size: var(--fs-lg);
        font-weight: 800;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .badge {
        font-size: var(--fs-xs);
        font-weight: 700;
        padding: 4px 9px;
        border-radius: var(--r-full);
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 26px;
      }
      .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .badge.demo {
        background: color-mix(in srgb, var(--c-warn) 16%, transparent);
        color: var(--c-warn);
        border: 1px solid color-mix(in srgb, var(--c-warn) 36%, transparent);
      }
      .badge.live {
        background: color-mix(in srgb, var(--c-ok) 16%, transparent);
        color: var(--c-ok);
        border: 1px solid color-mix(in srgb, var(--c-ok) 36%, transparent);
      }
      .modes {
        display: flex;
        gap: 2px;
        background: var(--c-surface);
        border: 1px solid var(--c-line);
        border-radius: var(--r-full);
        padding: 3px;
        flex: none;
      }
      .modes button {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: var(--sp-2) var(--sp-3);
        border-radius: var(--r-full);
        font-size: var(--fs-sm);
        font-weight: 600;
        color: var(--c-dim);
        min-height: 36px;
      }
      .modes button .ic {
        width: 16px;
        height: 16px;
      }
      .modes button.on {
        background: var(--grad);
        color: #06121a;
        font-weight: 700;
      }
      #tabs {
        display: flex;
        gap: 2px;
        background: color-mix(in srgb, var(--c-surface) 90%, transparent);
        border: 1px solid var(--c-line);
        border-radius: var(--r-full);
        padding: 3px;
        margin: 0 auto;
      }
      #tabs button {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: var(--sp-2) var(--sp-3);
        border-radius: var(--r-full);
        font-size: var(--fs-sm);
        font-weight: 600;
        color: var(--c-dim);
        min-height: 38px;
      }
      #tabs button .ic {
        width: 16px;
        height: 16px;
      }
      #tabs button.on {
        background: var(--grad);
        color: #06121a;
        font-weight: 700;
      }
      .ta {
        display: flex;
        gap: 0;
        flex: none;
      }
      #bSound.muted {
        color: var(--c-warn);
      }
      #bMore {
        display: none;
      }
      body[data-eff="mobile"] .desktop-only {
        display: none;
      }
      body[data-eff="mobile"] #bMore {
        display: inline-flex;
      }
      body[data-eff="mobile"] .brand b,
      body[data-eff="mobile"] .badge {
        display: none;
      }
      body[data-eff="mobile"] .modes button span {
        display: none;
      }
      body[data-eff="mobile"] .modes button {
        padding: var(--sp-2);
      }
      body[data-eff="mobile"] #tabs {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        top: auto;
        z-index: 60;
        margin: 0;
        border-radius: 0;
        border: none;
        border-top: 1px solid var(--c-line);
        background: color-mix(in srgb, var(--c-bg) 96%, transparent);
        backdrop-filter: blur(20px);
        height: calc(var(--nav) + var(--sab));
        padding: var(--sp-1) calc(var(--sp-1) + var(--sar))
          calc(var(--sp-1) + var(--sab)) calc(var(--sp-1) + var(--sal));
      }
      body[data-eff="mobile"] #tabs button {
        flex: 1;
        flex-direction: column;
        gap: 2px;
        padding: var(--sp-1);
        font-size: 10px;
        border-radius: var(--r-md);
        min-height: var(--tap);
      }
      body[data-eff="mobile"] #tabs button .ic {
        width: 20px;
        height: 20px;
      }
      body[data-eff="mobile"] #tabs button.on {
        background: color-mix(in srgb, var(--c-a1) 16%, transparent);
        color: var(--c-a1);
      }
      @media (max-width: 1240px) {
        .modes button span {
          display: none;
        }
        .modes button {
          padding: var(--sp-2);
        }
      }
      #ribbon {
        position: fixed;
        top: calc(var(--top) + var(--sat));
        left: 0;
        right: 0;
        z-index: 55;
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        padding: 6px calc(var(--sp-3) + var(--sar)) 6px
          calc(var(--sp-3) + var(--sal));
        background: linear-gradient(
          to bottom,
          color-mix(in srgb, var(--c-ink) 82%, transparent),
          transparent
        );
        pointer-events: none;
        font-size: var(--fs-xs);
        flex-wrap: wrap;
      }
      html[data-theme="light"] #ribbon {
        background: linear-gradient(
          to bottom,
          color-mix(in srgb, var(--c-bg) 92%, transparent),
          transparent
        );
      }
      .rpill {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: color-mix(in srgb, var(--c-a1) 18%, transparent);
        border: 1px solid color-mix(in srgb, var(--c-a1) 40%, transparent);
        color: var(--c-a1);
        font-weight: 700;
        padding: 4px 11px;
        border-radius: var(--r-full);
      }
      .rnote {
        color: var(--c-dim);
      }
      .rbtn {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: color-mix(in srgb, var(--c-warn) 18%, transparent);
        border: 1px solid color-mix(in srgb, var(--c-warn) 42%, transparent);
        color: var(--c-warn);
        font-weight: 700;
        padding: 4px 11px;
        border-radius: var(--r-full);
        min-height: 28px;
      }
      #feedView {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      body[data-eff="desktop"] #feed {
        display: none;
      }
      body[data-eff="mobile"] #stage {
        display: none;
      }
      #feed {
        height: 100dvh;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        overscroll-behavior: contain;
      }
      #feed::-webkit-scrollbar {
        display: none;
      }
      .reel {
        position: relative;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        overflow: hidden;
        background: #04060b;
        touch-action: pan-y;
        contain: layout paint;
      }
      .reel-bg {
        position: absolute;
        inset: -40px;
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.3) saturate(1.3);
        transform: scale(1.12);
      }
      .reel-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 1;
        padding: calc(var(--top) + var(--sat) + 26px) 0
          calc(var(--nav) + var(--sab) + 104px);
      }
      body[data-fit="cover"] .reel-video {
        object-fit: cover;
        padding: 0;
      }
      .reel-shade {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(
            to top,
            rgba(3, 5, 10, 0.94),
            rgba(3, 5, 10, 0.34) 26%,
            transparent 46%
          ),
          linear-gradient(to bottom, rgba(3, 5, 10, 0.72), transparent 18%);
      }
      .reel-ui {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      .playbtn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: rgba(8, 11, 18, 0.55);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        transition:
          opacity var(--dur),
          transform var(--dur);
      }
      .playbtn .ic {
        width: 30px;
        height: 30px;
        margin-left: 3px;
      }
      .reel.playing .playbtn {
        opacity: 0;
        pointer-events: none;

            S.videos.forEach(function (v, i) {
              if (set[v.id]) removed.push({ v: v, i: i });

            S.videos = S.videos.filter(function (v) {
              return !set[v.id];
            });
            ids.forEach(function (i) {
              S.sel.delete(i);
            });
            S.queue = S.queue.filter(function (v) {
              return !set[v.id];
            });
            S.lib.items = S.lib.items.filter(function (v) {
              return !set[v.id];
            });
            saveCache();
            rebuild(true);
            paintLib();
            loadTrash();
            var done = false;
            function commit() {
              if (done) return;
              done = true;
              post("/api/videos/trash", { ids: ids });

            toast(ids.length + " video trash mein gayi", "warn", {
              duration: 6000,
              action: {
                label: "Wapas lao",
                fn: function () {
                  if (done) return;
                  done = true;
                  clearTimeout(t);
                  removed.forEach(function (r) {
                    S.videos.splice(Math.min(r.i, S.videos.length), 0, r.v);
                  });
                  post("/api/videos/restore", { ids: ids });

                  rebuild(true);

              if (k === "loop")
                $$("video").forEach(function (v) {
                  v.loop = cb.checked;
                });
              if (k === "rm")
                document.documentElement.classList.toggle("rm", cb.checked);
              if (k === "dataSaver") $$(".reel[data-i]", feed).forEach(preload);
              if (k === "captions") setCC(cb.checked);
              if (k === "clean") setClean(cb.checked);
              if (k === "autoplay" && cb.checked && S.eff === "desktop")
                play(sv);
              toast("Save ho gaya", "ok", { duration: 1100 });
            };
          });
          $("#setTheme").onchange = function (e) {
            S.set.theme = e.target.value;
            store.set("set", S.set);
            document.documentElement.dataset.theme = e.target.value;
          };
          $("#setRatio").onchange = function (e) {
            S.set.ratio = e.target.value;
            S.allowAll = false;
            store.set("set", S.set);
            rebuild(true);
          };
          $("#setFit").onchange = function (e) {
            S.set.fit = e.target.value;
            store.set("set", S.set);
            document.body.dataset.fit = e.target.value;
          };
          $("#setVol").oninput = function (e) {
            setVol(e.target.value / 100);
          };
          $("#setSpeed").onchange = function (e) {
            setSpeed(parseFloat(e.target.value) || 1);
          };
          $("#setSleep").onchange = function (e) {
            S.set.sleep = parseInt(e.target.value, 10) || 0;
            store.set("set", S.set);
            setSleep(S.set.sleep);
            toast(
              S.set.sleep
                ? S.set.sleep + " min baad ruk jayega"
                : "Sleep timer band",
              "ok",
            );
          };
          $("#accents").onclick = function (e) {
            var b = e.target.closest("[data-accent]");
            if (!b) return;
            S.set.accent = b.dataset.accent;
            store.set("set", S.set);
            applySettings();
          };
          function arm(btn, label, fn) {
            if (btn.dataset.armed) {
              delete btn.dataset.armed;
              btn.innerHTML = btn.dataset.orig;
              fn();
              return;
            }
            btn.dataset.orig = btn.innerHTML;
            btn.dataset.armed = "1";
            btn.innerHTML = label;
            setTimeout(function () {
              if (btn.dataset.armed) {
                delete btn.dataset.armed;
                btn.innerHTML = btn.dataset.orig;
              }
            }, 3000);
          }
          $("#bBackup").onclick = function () {
            if (S.live) return window.open("/api/export", "_blank");
            var a = document.createElement("a");
            a.href = URL.createObjectURL(
              new Blob(
                [
                  JSON.stringify(
                    { engagement: S.eng, playlists: S.pls, settings: S.set },
                    null,
                    2,
                  ),
                ],
                { type: "application/json" },
              ),
            );
            a.download = "localreels-backup.json";
            a.click();
          };
          $("#restoreFile").onchange = function (e) {
            var f = e.target.files && e.target.files[0];
            if (!f) return;
            f.text()
              .then(function (t) {
                var d = JSON.parse(t);
                if (!S.live) {
                  if (d.engagement || d.eng) {
                    S.eng = d.engagement || d.eng;
                    saveEng();
                  }
                  if (d.playlists) {
                    S.pls = d.playlists;
                    store.set("pls", S.pls);
                  }
                  if (d.settings) {
                    Object.assign(S.set, d.settings);
                    store.set("set", S.set);
                  }
                  applySettings();
                  rebuild(true);
                  toast("Restore ho gaya", "ok");
                  return;
                }
                return post("/api/restore", d).then(function (r) {
                  if (r && r.ok) {
                    toast(
                      "Restore ho gaya — " + r.restored.videos + " videos",
                      "ok",
                    );
                    return refreshFeedVideos().then(function () {
                      loadState();
                      loadLib(true);
                    });
                  } else toast("Restore fail — file check karo", "err");
                });
              })
              .catch(function () {
                toast("File padhi nahi ja saki", "err");
              });
            e.target.value = "";
          };
          $("#bStats").onclick = function () {
            closeOvl();
            openStats();
          };
          $("#bScanSet").onclick = function () {
            closeOvl();
            startScan();
          };
          $("#bKeys").onclick = function () {
            openOvl("keysModal");
          };
          $("#bGuide").onclick = function () {
            closeOvl();
            openOvl("onboard");
          };
          $("#bClearHist").onclick = function (e) {
            arm(e.currentTarget, "Pakka? Dobara click karo", function () {
              for (var i in S.eng) {
                S.eng[i].position = 0;
                S.eng[i].watch = 0;
                S.eng[i].views = 0;
              }
              S.resumed.clear();
              saveEng();
              post("/api/history/clear");
              if (S.tab === "library") loadLib(true);
              toast("History saaf ho gayi", "ok");
            });
          };
          $("#bReset").onclick = function (e) {
            arm(e.currentTarget, "Sab data udd jayega — confirm?", function () {
              try {
                Object.keys(localStorage).forEach(function (k) {
                  if (k.indexOf("lr9") === 0) localStorage.removeItem(k);
                });
              } catch (x) {}
              location.reload();
            });
          };

          $("#bSearch").onclick = openSearch;
          $("#bAdd").onclick = function () {
            openOvl("addModal");
            loadJobs();
          };
          $("#bPhone").onclick = openPhone;
          $("#bSet").onclick = function () {
            applySettings();
            openOvl("setSheet");
          };
          $("#bMore").onclick = function () {
            openOvl("moreModal");
          };
          $$("#moreModal [data-go]").forEach(function (b) {
            b.onclick = function () {
              closeOvl();
              go(b.dataset.go);
            };
          });
          $("#moAdd").onclick = function () {
            closeOvl();
            openOvl("addModal");
            loadJobs();
          };
          $("#moPhone").onclick = function () {
            closeOvl();
            openPhone();
          };
          $("#moStats").onclick = function () {
            closeOvl();
            openStats();
          };
          $("#obGo").onclick = function () {
            closeOvl();
            S.onboarded = true;
            store.set("onboarded", true);
          };
          $("#obKeys").onclick = function () {
            closeOvl();
            S.onboarded = true;
            store.set("onboarded", true);
            openOvl("keysModal");
          };
          $("#scrim").onclick = function () {
            closeOvl();
          };
          $$("[data-close]").forEach(function (b) {
            b.onclick = function () {
              closeOvl(b.closest(".ovl"));
            };
          });
          $("#conn").onclick = function () {
            toast(
              S.live
                ? "Live ✅ · SQL " +
                    (S.fts ? "FTS5" : "LIKE") +
                    " · scan " +
                    (S.scanDone ? "cached" : "pending")
                : "Demo mode — run.bat chalao",
            );
          };
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              if (stack.length) {
                closeOvl();
                e.preventDefault();
              }
              return;
            }
            if (e.target.matches("input,textarea,select") || stack.length)
              return;
            var k = e.key,
              v = cur(),
              vd = playerVid();
            if (k === " ") {
              e.preventDefault();
              if (vd) vd.paused ? play(vd) : vd.pause();
            } else if (k === "ArrowDown" || k === "j" || k === "J") {
              e.preventDefault();
              next();
            } else if (k === "ArrowUp" || k === "k" || k === "K") {
              e.preventDefault();
              prev();
            } else if (k === "ArrowRight") {
              e.preventDefault();
              if (vd && vd.duration)
                vd.currentTime = Math.min(vd.duration, vd.currentTime + 10);
            } else if (k === "ArrowLeft") {
              e.preventDefault();
              if (vd) vd.currentTime = Math.max(0, vd.currentTime - 10);
            } else if (k === "m" || k === "M") toggleMute();
            else if (k === "l" || k === "L") {
              if (v) toggleLike(v.id);
            } else if (k === "f" || k === "F") $("#tFull").click();
            else if (k === "s" || k === "S") {
              if (v) toggleSave(v.id);
            } else if (k === "c" || k === "C") {
              if (v) {
                if (S.eff === "desktop") {
                  $$(".side-tabs button")[1].click();
                  $("#sideCmInput").focus();
                } else openComments(v.id);
              }
            } else if (k === "h" || k === "H") setClean(!S.set.clean);
            else if (k === "p" || k === "P") $("#tPip").click();
            else if (k === "/") {
              e.preventDefault();
              openSearch();
            } else if (k === "?") openOvl("keysModal");
            else if (k === "g" || k === "G") go("library");
            else if (k === "1" || k === "2" || k === "3") {
              S.viewMode =
                k === "1" ? "auto" : k === "2" ? "desktop" : "mobile";
              store.set("viewMode", S.viewMode);
              S.allowAll = false;
              applyMode();
            }
          });
          document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
              S.wasPlaying = isPlaying();
              $$("video").forEach(function (v) {
                v.pause();
              });
            } else if (
              S.wasPlaying &&
              S.set.autoplay &&
              ["library", "lists", "trash"].indexOf(S.tab) < 0
            )
              play(playerVid());
          });
          window.addEventListener("beforeunload", function () {
            store.set("eng", S.eng);
            saveCache();
          });
          var installEvt = null;
          window.addEventListener("beforeinstallprompt", function (e) {
            e.preventDefault();
            installEvt = e;
            $("#bInstall").classList.remove("hidden");
          });
          $("#bInstall").onclick = function () {
            if (!installEvt) return;
            installEvt.prompt();
            installEvt.userChoice.then(function () {
              installEvt = null;
              $("#bInstall").classList.add("hidden");
            });
          };

          var bootHidden = false;
          function hideBoot() {
            if (bootHidden) return;
            bootHidden = true;
            var b = $("#boot");
            if (b) {
              b.classList.add("gone");
              setTimeout(function () {
                b.remove();
              }, 400);
            }
          }
          function bootMsg(t) {
            var e = $("#bootMsg");
            if (e) e.textContent = t;
          }
          setTimeout(hideBoot, 7000);
          function refreshFeedVideos() {
            if (!S.live) return Promise.resolve();
            return api("/api/videos?limit=200&sort=new")
              .then(function (d) {
                var fresh = (d.videos || []).map(mp),
                  map = {};
                S.videos.forEach(function (v) {
                  map[v.id] = v;
                });
                fresh.forEach(function (v) {
                  map[v.id] = v;
                });
                S.videos = Object.keys(map)
                  .map(function (k) {
                    return map[k];
                  })
                  .sort(function (a, b) {
                    return b.added - a.added;
                  });
                S.total = d.total || S.videos.length;
                saveCache();
                topUp();
                ribbon();
              })
              .catch(function () {});
          }
          function loadState() {
            if (!S.live) return Promise.resolve();
            return api("/api/state")
              .then(function (st) {
                var e = st.engagement || {};
                for (var k in e) S.eng[k] = e[k];
                S.cnt = st.comment_counts || S.cnt;
                S.rx = st.reactions || S.rx;
                S.pls = st.playlists || S.pls;
                S.views = st.saved_views || S.views;
                S.sources = st.sources || S.sources;
                if (st.settings)
                  for (var x in st.settings) S.set[x] = st.settings[x];
                saveEng();
                store.set("cnt", S.cnt);
                store.set("pls", S.pls);
                store.set("views", S.views);
                store.set("set", S.set);
                applySettings();
              })
              .catch(function () {});
          }
          function loadRest() {
            if (!S.live) return Promise.resolve();
            function step() {
              if (S.videos.length >= S.total) return Promise.resolve();
              return api("/api/videos?skip=" + S.videos.length + "&limit=200")
                .then(function (d) {
                  var have = {};
                  S.videos.forEach(function (v) {
                    have[v.id] = 1;
                  });
                  var add = (d.videos || []).map(mp).filter(function (v) {
                    return !have[v.id];
                  });
                  if (!add.length) return;
                  S.videos = S.videos.concat(add);
                  topUp();
                  return new Promise(function (r) {
                    setTimeout(r, 50);
                  }).then(step);
                })
                .catch(function () {});
            }
            return step().then(saveCache);
          }
          function fromCache() {
            var c = store.get("cache", null);
            if (!c || !c.items || !c.items.length) return false;
            S.videos = c.items.map(mp);
            S.total = c.total || S.videos.length;
            S.scanDone = !!store.get("scanDone", false);
            applyMode(false);
            applySettings();
            syncTabs();
            rebuild(false);
            showView("feed");
            bootMsg("Cache se chal raha hai…");
            return true;
          }
          function boot() {
            var had = fromCache();
            if (!had) {
              applyMode(false);
              applySettings();
              syncTabs();
              bootMsg("Server se data la rahe hain…");
            }
            return tmo(api("/api/bootstrap?limit=40"), 6000)
              .catch(function () {
                return null;
              })
              .then(function (bs) {
                if (bs && bs.ok) {
                  S.live = true;
                  S.ffprobe = !!bs.ffmpeg;
                  S.fts = !!bs.fts;
                  S.lan = bs.lan;
                  S.total = bs.total || 0;
                  var first = (bs.videos || []).map(mp),
                    fids = {};
                  first.forEach(function (v) {
                    fids[v.id] = 1;
                  });
                  S.videos = first.concat(
                    S.videos.filter(function (v) {
                      return !fids[v.id];
                    }),
                  );
                  S.scan = bs.scan || S.scan;
                  S.scanDone = !!(bs.scan && bs.scan.complete);
                  store.set("scanDone", S.scanDone);
                  var st = bs.state || {};
                  var e = st.engagement || {};
                  for (var k in e) S.eng[k] = e[k];
                  S.cnt = st.comment_counts || S.cnt;
                  S.rx = st.reactions || S.rx;
                  S.pls = st.playlists || S.pls;
                  S.views = st.saved_views || S.views;
                  S.sources = st.sources || S.sources;
                  if (st.settings)
                    for (var x in st.settings) S.set[x] = st.settings[x];
                  saveEng();
                  store.set("pls", S.pls);
                  store.set("views", S.views);
                  store.set("set", S.set);
                  $("#conn").textContent = "Live";
                  $("#conn").className = "badge live";
                  saveCache();
                  applySettings();
                  if (!had) {
                    rebuild(false);
                    showView("feed");
                  } else {
                    topUp();
                    ribbon();
                  }
                  hideBoot();
                  loadRest();
                  if (!S.scanDone && S.ffprobe)
                    post("/api/aspects/scan", {}).then(function (r) {
                      if (r && r.scan && !r.already_complete) {
                        S.scan = r.scan;
                        ribbon();
                        pollScan();
                      } else if (r && r.already_complete) {
                        S.scanDone = true;
                        store.set("scanDone", true);
                        ribbon();
                      }
                    });
                  return;
                }
                return tmo(api("/api/videos?limit=40"), 5000)
                  .then(function (d) {
                    S.live = true;
                    S.videos = (d.videos || []).map(mp);
                    S.total = d.total || S.videos.length;
                    return loadState();
                  })
                  .catch(function () {
                    if (!S.videos.length) {
                      S.videos = seed();
                      S.total = S.videos.length;
                      S.scanDone = true;
                    }
                  })
                  .then(function () {
                    $("#conn").textContent = S.live ? "Live" : "Demo";
                    $("#conn").className =
                      "badge " + (S.live ? "live" : "demo");
                    saveCache();
                    applySettings();
                    rebuild(false);
                    showView("feed");
                    hideBoot();
                    if (S.live) loadRest();
                  });
              })
              .then(function () {
                var m = location.hash.match(/#v=(.+)/);
                if (m)
                  setTimeout(function () {
                    openInFeed(decodeURIComponent(m[1]));
                  }, 300);
                if (!S.onboarded)
                  setTimeout(function () {
                    openOvl("onboard");
                  }, 900);
                if (S.set.sleep) setSleep(S.set.sleep);
                if (
                  "serviceWorker" in navigator &&
                  /^https?:$/.test(location.protocol)
                )
                  navigator.serviceWorker
                    .register("/sw.js")
                    .catch(function () {});
              })
              .catch(function (err) {
                if (!S.videos.length) {
                  S.videos = seed();
                  S.total = S.videos.length;
                  S.scanDone = true;
                }
                applySettings();
                rebuild(false);
                showView("feed");
                hideBoot();
                toast("Offline mode: " + ((err && err.message) || ""), "warn");
              });
          }
          boot();
        } catch (e) {
          fatal((e && e.stack) || e);
        }
      })();
    </script>
  </body>
</html>
