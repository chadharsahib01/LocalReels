<!doctype html>
<html lang="hi" data-accent="teal">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080B12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>LocalReels</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232CE5C8'/%3E%3Cpath d='M13 10v12l9-6z' fill='%2306121A'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #05070c;
        --bg: #080b12;
        --sf: #101624;
        --sf2: #182031;
        --ln: #232d45;
        --ln2: #33415f;
        --tx: #f2f6fc;
        --dm: #8b96ae;
        --ft: #5a6580;
        --a1: #2ce5c8;
        --a2: #4d9fff;
        --a3: #ff3d7f;
        --ok: #7ee56a;
        --wn: #ffb020;
        --dg: #ff5252;
        --vi: #9d7bff;
        --gr: linear-gradient(135deg, var(--a1), var(--a2) 52%, var(--a3));
        --top: 60px;
        --nav: 0px;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sh: 0 18px 50px rgba(0, 0, 0, 0.6);
      }
      html[data-accent="magenta"] {
        --a1: #ff3d7f;
        --a2: #9d7bff;
        --a3: #2ce5c8;
      }
      html[data-accent="amber"] {
        --a1: #ffb020;
        --a2: #ff6b3d;
        --a3: #4d9fff;
      }
      html[data-accent="lime"] {
        --a1: #a3e635;
        --a2: #2ce5c8;
        --a3: #ff3d7f;
      }
      body[data-eff="mobile"] {
        --top: 52px;
        --nav: 56px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font-family: Inter, system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      body.lock {
        overflow: hidden;
      }
      h1,
      h2,
      h3,
      .brand b,
      .sn {
        font-family: Sora, Inter, sans-serif;
        letter-spacing: -0.01em;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      input,
      select {
        font: inherit;
        color: var(--tx);
        background: var(--sf2);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 11px 13px;
        font-size: 14px;
        outline: none;
        width: 100%;
      }
      input:focus,
      select:focus {
        border-color: var(--a1);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--a1) 20%, transparent);
      }
      select {
        appearance: none;
        cursor: pointer;
        padding-right: 30px;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--dm) 50%),
          linear-gradient(135deg, var(--dm) 50%, transparent 50%);
        background-position:
          calc(100% - 16px) 50%,
          calc(100% - 11px) 50%;
        background-size: 5px 5px;
        background-repeat: no-repeat;
      }
      option {
        background: var(--sf);
      }
      :focus-visible {
        outline: 2px solid var(--a1);
        outline-offset: 2px;
      }
      .hidden {
        display: none !important;
      }
      .sub {
        color: var(--dm);
        font-size: 12px;
      }
      .note {
        font-size: 11px;
        color: var(--ft);
        line-height: 1.6;
        margin-top: 10px;
      }
      .mt {
        margin-top: 14px;
      }
      .full {
        width: 100%;
        justify-content: center;
      }
      .row {
        display: flex;
        gap: 9px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .row.tight {
        gap: 5px;
        flex-wrap: nowrap;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--ln2) transparent;
      }
      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--ln2);
        border-radius: 8px;
        border: 2px solid var(--bg);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--a1);
      }
      .aur {
        position: fixed;
        width: 58vmax;
        height: 58vmax;
        border-radius: 50%;
        filter: blur(95px);
        opacity: 0.1;
        pointer-events: none;
        z-index: 0;
        will-change: transform;
      }
      .aur.a {
        background: radial-gradient(circle, var(--a1), var(--a2));
        top: -26vmax;
        left: -16vmax;
      }
      .aur.b {
        background: radial-gradient(circle, var(--a3), var(--vi));
        bottom: -28vmax;
        right: -18vmax;
      }
      .ic {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .ic.xs {
        width: 15px;
        height: 15px;
      }
      .ic.big {
        width: 46px;
        height: 46px;
        stroke-width: 1.5;
        color: var(--ft);
      }
      .ic.xl {
        width: 38px;
        height: 38px;
        color: var(--a1);
      }
      .ic.fill {
        fill: currentColor;
        stroke: none;
      }
      .spin {
        animation: sp 1.1s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: var(--gr);
        color: #06121a;
        font-weight: 700;
        font-size: 13.5px;
        padding: 10px 16px;
        border-radius: 12px;
        transition:
          transform 0.14s,
          filter 0.14s;
        white-space: nowrap;
      }
      .btn:hover {
        filter: brightness(1.12);
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn .ic {
        width: 17px;
        height: 17px;
      }
      .btn.gh {
        background: var(--sf2);
        color: var(--tx);
        border: 1px solid var(--ln);
      }
      .btn.gh:hover {
        border-color: var(--a1);
        color: var(--a1);
      }
      .btn.dg {
        background: color-mix(in srgb, var(--dg) 15%, transparent);
        color: var(--dg);
        border: 1px solid color-mix(in srgb, var(--dg) 40%, transparent);
      }
      .btn.xs {
        padding: 6px 11px;
        font-size: 12px;
        border-radius: 10px;
      }
      .btn.xs .ic {
        width: 14px;
        height: 14px;
      }
      .lb {
        color: var(--a1);
        font-size: 12px;
        font-weight: 600;
        text-decoration: underline;
      }
      .ib {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--dm);
        transition:
          background 0.15s,
          color 0.15s;
        flex: none;
      }
      .ib:hover {
        background: var(--sf2);
        color: var(--tx);
      }
      .ib:active {
        transform: scale(0.9);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: color-mix(in srgb, var(--a1) 12%, transparent);
        color: var(--a1);
        border: 1px solid color-mix(in srgb, var(--a1) 28%, transparent);
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 11.5px;
        font-weight: 600;
      }
      .chip.mini {
        padding: 3px 8px;
        font-size: 10.5px;
      }
      .tag {
        background: color-mix(in srgb, var(--vi) 14%, transparent);
        color: #c9b6ff;
        border: 1px solid color-mix(in srgb, var(--vi) 30%, transparent);
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 11px;
      }
      .tag.mini {
        padding: 2px 7px;
        font-size: 10px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 9px 0;
      }
      .seg {
        display: flex;
        background: var(--sf2);
        border: 1px solid var(--ln);
        border-radius: 11px;
        padding: 3px;
        gap: 2px;
      }
      .seg button {
        padding: 5px 9px;
        border-radius: 8px;
        color: var(--dm);
        display: flex;
      }
      .seg button .ic {
        width: 16px;
        height: 16px;
      }
      .seg button.on {
        background: var(--gr);
        color: #06121a;
      }
      #top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 60;
        height: calc(var(--top) + var(--sat));
        padding: var(--sat) calc(10px + var(--sar)) 0 calc(10px + var(--sal));
        display: flex;
        align-items: center;
        gap: 8px;
        background: color-mix(in srgb, var(--bg) 84%, transparent);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--ln);
        transition:
          transform 0.25s,
          opacity 0.25s;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .brand i {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--gr);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brand i svg {
        width: 14px;
        height: 14px;
        fill: #06121a;
      }
      .brand b {
        font-size: 16px;
        font-weight: 800;
        background: var(--gr);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .cb {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .cb::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .cb.demo {
        background: color-mix(in srgb, var(--wn) 14%, transparent);
        color: var(--wn);
        border: 1px solid color-mix(in srgb, var(--wn) 32%, transparent);
      }
      .cb.live {
        background: color-mix(in srgb, var(--ok) 14%, transparent);
        color: var(--ok);
        border: 1px solid color-mix(in srgb, var(--ok) 32%, transparent);
      }
      .ms {
        display: flex;
        gap: 2px;
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 999px;
        padding: 3px;
        flex: none;
      }
      .ms button {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--dm);
      }
      .ms button .ic {
        width: 15px;
        height: 15px;
      }
      .ms button.on {
        background: var(--gr);
        color: #06121a;
        font-weight: 700;
      }
      #tabs {
        display: flex;
        gap: 2px;
        background: color-mix(in srgb, var(--sf) 88%, transparent);
        border: 1px solid var(--ln);
        border-radius: 999px;
        padding: 3px;
        margin: 0 auto;
      }
      #tabs button {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        color: var(--dm);
      }
      #tabs button .ic {
        width: 15px;
        height: 15px;
      }
      #tabs button.on {
        background: var(--gr);
        color: #06121a;
        font-weight: 700;
      }
      .ta {
        display: flex;
        gap: 1px;
        flex: none;
      }
      #bSound.muted {
        color: var(--wn);
      }
      body[data-eff="mobile"] .odes {
        display: none;
      }
      body[data-eff="mobile"] .brand b,
      body[data-eff="mobile"] .cb {
        display: none;
      }
      body[data-eff="mobile"] .ms button span {
        display: none;
      }
      body[data-eff="mobile"] .ms button {
        padding: 6px 8px;
      }
      body[data-eff="mobile"] #tabs {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        top: auto;
        z-index: 60;
        margin: 0;
        border-radius: 0;
        border: none;
        border-top: 1px solid var(--ln);
        background: color-mix(in srgb, var(--bg) 94%, transparent);
        backdrop-filter: blur(20px);
        height: calc(var(--nav) + var(--sab));
        padding: 4px calc(5px + var(--sar)) calc(4px + var(--sab))
          calc(5px + var(--sal));
      }
      body[data-eff="mobile"] #tabs button {
        flex: 1;
        flex-direction: column;
        gap: 2px;
        padding: 4px 2px;
        font-size: 9px;
        border-radius: 11px;
      }
      body[data-eff="mobile"] #tabs button.on {
        background: color-mix(in srgb, var(--a1) 14%, transparent);
        color: var(--a1);
      }
      @media (max-width: 1200px) {
        .ms button span {
          display: none;
        }
        .ms button {
          padding: 6px 9px;
        }
      }
      #rib {
        position: fixed;
        top: calc(var(--top) + var(--sat));
        left: 0;
        right: 0;
        z-index: 55;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px calc(12px + var(--sar)) 6px calc(12px + var(--sal));
        background: linear-gradient(
          to bottom,
          color-mix(in srgb, var(--ink) 85%, transparent),
          transparent
        );
        pointer-events: none;
        font-size: 11px;
        flex-wrap: wrap;
      }
      .rp {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: color-mix(in srgb, var(--a1) 16%, transparent);
        border: 1px solid color-mix(in srgb, var(--a1) 38%, transparent);
        color: var(--a1);
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
      }
      .rn {
        color: var(--dm);
        text-shadow: 0 1px 4px #000;
      }
      .rb {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: color-mix(in srgb, var(--wn) 16%, transparent);
        border: 1px solid color-mix(in srgb, var(--wn) 40%, transparent);
        color: var(--wn);
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
      }
      #fv {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      body[data-eff="desktop"] #feed {
        display: none;
      }
      body[data-eff="mobile"] #stage {
        display: none;
      }
      #feed {
        height: 100dvh;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        overscroll-behavior: contain;
      }
      #feed::-webkit-scrollbar {
        display: none;
      }
      .reel {
        position: relative;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        overflow: hidden;
        background: #04060b;
        touch-action: pan-y;
        contain: layout paint;
      }
      .rbg {
        position: absolute;
        inset: -40px;
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.3) saturate(1.3);
        transform: scale(1.12) translateZ(0);
      }
      .rv {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 1;
        padding: calc(var(--top) + var(--sat) + 24px) 0
          calc(var(--nav) + var(--sab) + 92px);
      }
      body[data-fit="cover"] .rv {
        object-fit: cover;
        padding: 0;
      }
      .rsh {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(
            to top,
            rgba(3, 5, 10, 0.92),
            rgba(3, 5, 10, 0.3) 24%,
            transparent 44%
          ),
          linear-gradient(to bottom, rgba(3, 5, 10, 0.7), transparent 16%);
      }
      .rui {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      .ps {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(8, 11, 18, 0.5);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .ps .ic {
        width: 28px;
        height: 28px;
        margin-left: 3px;
      }
      .reel.playing .ps {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.75);
      }
      .rsp {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 4;
      }
      .sb {
        position: absolute;
        top: calc(var(--top) + var(--sat) + 36px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        background: color-mix(in srgb, var(--wn) 18%, transparent);
        color: var(--wn);
        border: 1px solid color-mix(in srgb, var(--wn) 45%, transparent);
        font-weight: 700;
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 999px;
      }
      .rer {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 9px;
        align-items: center;
        background: rgba(8, 11, 18, 0.92);
        border: 1px solid color-mix(in srgb, var(--dg) 45%, transparent);
        padding: 16px 20px;
        border-radius: 16px;
        font-size: 12.5px;
        color: var(--dm);
        text-align: center;
        max-width: 80%;
      }
      .rail {
        position: absolute;
        right: calc(7px + var(--sar));
        bottom: calc(var(--nav) + var(--sab) + 100px);
        display: flex;
        flex-direction: column;
        gap: 13px;
        align-items: center;
        pointer-events: auto;
      }
      .rl {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        color: #fff;
        min-width: 44px;
        min-height: 44px;
        justify-content: center;
      }
      .rl .ic {
        width: 26px;
        height: 26px;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
      }
      .rl .cnt {
        font-size: 10px;
        font-weight: 600;
        text-shadow: 0 1px 4px #000;
      }
      .rl.on.like {
        color: var(--a3);
      }
      .rl.on.like .ic {
        fill: currentColor;
        stroke: none;
      }
      .rl.on.save {
        color: var(--wn);
      }
      .rl.on.save .ic {
        fill: currentColor;
        stroke: none;
      }
      .rl.pop .ic {
        animation: pop 0.4s ease;
      }
      @keyframes pop {
        40% {
          transform: scale(1.4);
        }
      }
      .rl.av {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--gr);
        color: #06121a;
        font-family: Sora;
        font-weight: 800;
        font-size: 16px;
        border: 2px solid rgba(255, 255, 255, 0.8);
      }
      .info {
        position: absolute;
        left: calc(11px + var(--sal));
        right: calc(66px + var(--sar));
        bottom: calc(var(--nav) + var(--sab) + 20px);
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
        pointer-events: auto;
      }
      .vt {
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.4;
        text-shadow: 0 1px 6px #000;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-align: left;
      }
      .vt.expanded {
        -webkit-line-clamp: unset;
      }
      .vm {
        display: flex;
        gap: 7px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.72);
      }
      .vm span {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .vtg {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        max-height: 24px;
        overflow: hidden;
      }
      .snd {
        display: flex;
        align-items: center;
        gap: 6px;
        color: rgba(255, 255, 255, 0.85);
        font-size: 11px;
        max-width: 100%;
      }
      .disc {
        width: 22px;
        height: 22px;
        border-radius: 50%;
